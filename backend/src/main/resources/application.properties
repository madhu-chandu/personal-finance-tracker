spring.application.name=personal-finance-tracker

# ==========================
# Database (MySQL)
# ==========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
# ==========================
# JWT
# ==========================
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProduction123456
app.jwt.expiration-ms=86400000

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=https://personal-finance-tracker-flame-eight.vercel.app

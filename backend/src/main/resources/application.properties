spring.application.name=personal-finance-tracker

# ==========================
# Database (MySQL)
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Remove this line if present
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# JWT
# ==========================
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProduction123456
app.jwt.expiration-ms=86400000

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=http://localhost:4200
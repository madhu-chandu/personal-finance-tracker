<div class="auth-container">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Create your account</h2>
    <p class="text-muted">Start tracking your income and expenses</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="Choose a username">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="At least 6 characters">
    </div>

    <p class="text-danger" *ngIf="error">{{ error }}</p>

    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Creating account...' : 'Sign Up' }}
    </button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>

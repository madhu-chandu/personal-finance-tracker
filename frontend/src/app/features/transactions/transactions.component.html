<div class="transactions-page">
  <div class="header-row">
    <h1>Transactions</h1>
    <button class="btn btn-primary" (click)="openAddForm()">+ Add Transaction</button>
  </div>

  <p *ngIf="error" class="text-danger">{{ error }}</p>

  <div class="card form-card" *ngIf="showForm">
    <h3>{{ editingId ? 'Edit' : 'Add' }} Transaction</h3>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid grid-cols-2 form-grid">
        <div class="form-group">
          <label>Type</label>
          <select formControlName="type">
            <option value="EXPENSE">Expense</option>
            <option value="INCOME">Income</option>
          </select>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select formControlName="categoryId">
            <option [value]="null" disabled>Select category</option>
            <option *ngFor="let c of filteredCategories" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" step="0.01" formControlName="amount" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" formControlName="date">
        </div>
        <div class="form-group full-width">
          <label>Description</label>
          <input type="text" formControlName="description" placeholder="Optional note">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      </div>
    </form>
  </div>

  <div class="card">
    <p *ngIf="loading" class="text-muted">Loading transactions...</p>
    <p *ngIf="!loading && transactions.length === 0" class="text-muted">No transactions yet. Add your first one!</p>

    <table *ngIf="!loading && transactions.length > 0">
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Type</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tx of transactions">
          <td data-label="Date">{{ tx.date }}</td>
          <td data-label="Category">{{ tx.categoryName }}</td>
          <td data-label="Type">
            <span class="badge" [class.badge-income]="tx.type === 'INCOME'" [class.badge-expense]="tx.type === 'EXPENSE'">
              {{ tx.type }}
            </span>
          </td>
          <td data-label="Description">{{ tx.description || '-' }}</td>
          <td data-label="Amount" [class.text-success]="tx.type === 'INCOME'" [class.text-danger]="tx.type === 'EXPENSE'">
            ₹{{ tx.amount | number:'1.2-2' }}
          </td>
          <td data-label="Actions">
            <button class="btn-icon" (click)="editTransaction(tx)">✏️</button>
            <button class="btn-icon" (click)="deleteTransaction(tx.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

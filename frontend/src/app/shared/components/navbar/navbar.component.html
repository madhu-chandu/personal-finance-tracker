<nav class="navbar" *ngIf="authService.isLoggedIn()">
  <div class="navbar-inner">
    <span class="brand">💰 FinanceTracker</span>

    <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">☰</button>

    <div class="nav-links" [class.open]="menuOpen">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen=false">Dashboard</a>
      <a routerLink="/transactions" routerLinkActive="active" (click)="menuOpen=false">Transactions</a>
      <a routerLink="/budgets" routerLinkActive="active" (click)="menuOpen=false">Budgets</a>
      <span class="username">{{ authService.currentUsername() }}</span>
      <button class="btn btn-secondary logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>
